<!doctype html>
<html lang="ja">
<head>
    <!-- Meta Properties -->
    <meta charset="UTF-8">
    <title>オープンアガー</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no">
    <!-- CSS -->
    <link rel="stylesheet" href="css/main.css" />
    <!-- Audio -->
    <audio id="split_cell" src="audio/split.mp3"></audio>
    <audio id="spawn_cell" src="audio/spawn.mp3"></audio>
</head>
<body>
    <div id="gameAreaWrapper">
        <div id="status"><span class="title">リーダーボード</span></div>
        <div class="chatbox" id="chatbox">
            <ul id="chatList" class="chat-list"></ul>
            <input id="chatInput" type="text" class="chat-input" placeholder="ここでチャット..." maxlength="35" />
        </div>
        <div id="mobile">
           <input type="image" id="split" class="split" src="img/split.png" alt="分裂ボタン">
           <input type="image" id="feed" class="feed" src="img/feed.png" alt="餌やりボタン">
        </div>
        <canvas tabindex="1" id="cvs"></canvas>
    </div>
    <div id="startMenuWrapper">
        <div id="startMenu">
            <p>オープンアガー</p>
            <input type="text" tabindex="0" autofocus placeholder="ここに名前を入力" id="playerNameInput" maxlength="25" />
            <b class="input-error">ニックネームは英数字のみ使用可能です！</b>
            <br />
            <a onclick="document.getElementById('spawn_cell').play();"><button id="startButton">プレイ</button></a>
            <button id="spectateButton">観戦</button>
            <button id="settingsButton">設定</button>
            <br />
            <div id="settings">
                <h3>設定</h3>
                <ul>
                    <label><input id="visBord" type="checkbox">境界線を表示</label>
                    <label><input id="showMass" type="checkbox">質量を表示</label>
                    <br />
                    <label><input id="continuity" type="checkbox">マウスが画面外でも移動を継続</label>
                    <br />
                    <label><input id="roundFood" type="checkbox" checked>丸い餌</label>
                    <label><input id="darkMode" type="checkbox">ダークモード切替</label>
                </ul>
            </div>
            <div id="instructions">
                <h3>遊び方</h3>
                <ul>
                    <li>画面上でマウスを動かしてキャラクターを操作します。</li>
                    <li>餌や他のプレイヤーを食べてキャラクターを大きくします（餌は食べられると再出現します）。</li>
                    <li>プレイヤーの質量は食べた餌の数で決まります。</li>
                    <li>目的: 大きくなって他のプレイヤーを食べましょう。</li>
                </ul>
            </div>
        </div>
    </div>
    <!-- JS -->
    <script src="//code.jquery.com/jquery-2.2.0.min.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
